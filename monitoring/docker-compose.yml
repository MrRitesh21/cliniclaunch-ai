# ClinicX monitoring stack — Grafana + Prometheus + Alertmanager ONLY.
# Sized for a single Render Free / 512 MB instance: ~300-340 MB total.
# Loki, Tempo, OTel Collector, Jaeger, Elasticsearch etc. are intentionally absent.
services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: clinicx-prometheus
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 7 days retention, hard size cap so the disk can never fill.
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=512MB
      # Memory savers: smaller head chunk pool, no admin API, no remote write.
      - --storage.tsdb.head-chunks-write-queue-size=0
      - --query.max-concurrency=4
      - --query.max-samples=5000000
      - --web.enable-lifecycle
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
      - --log.level=warn
    environment:
      # Referenced from prometheus.yml so no secret is committed.
      METRICS_TOKEN: ${METRICS_TOKEN}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    expose:
      - "9090"
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 200M
    logging: &compact-logs
      driver: json-file
      options:
        max-size: "10m"
        max-file: "2"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: clinicx-alertmanager
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --data.retention=72h
      - --log.level=warn
      - --cluster.listen-address=
    env_file: .env
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    expose:
      - "9093"
    ports:
      - "127.0.0.1:9093:9093"
    deploy:
      resources:
        limits:
          memory: 48M
    logging: *compact-logs

  grafana:
    image: grafana/grafana-oss:11.3.1
    container_name: clinicx-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    env_file: .env
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GF_SERVER_ROOT_URL}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ALERTING_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "false"
      # SQLite is the lightest backend; Postgres would add connections we don't need.
      GF_DATABASE_TYPE: sqlite3
      GF_DATABASE_WAL: "true"
      GF_LOG_LEVEL: warn
      # Trim the image's memory footprint: no plugin catalogue, no live streaming.
      GF_PLUGINS_ENABLE_ALPHA: "false"
      GF_LIVE_MAX_CONNECTIONS: "10"
      GF_DATAPROXY_TIMEOUT: "30"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          memory: 110M
    logging: *compact-logs

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
