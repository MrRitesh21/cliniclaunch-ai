apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: clinicx-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      httpMethod: POST
      # Matches the 7-day retention; stops the UI offering ranges with no data.
      incrementalQuerying: true
      cacheLevel: Low
