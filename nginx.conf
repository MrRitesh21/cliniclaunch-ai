# Scalable Nginx Reverse Proxy & Micro-Caching Configuration

worker_processes auto;
events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance Tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Micro-Cache for High Traffic Public Pages
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=clinic_cache:10m max_size=500m inactive=60m use_temp_path=off;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=booking_limit:10m rate=5r/s;

    upstream node_app {
        server app:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Static Assets - Direct Disk Serve + Immutable Cache
        location ~* \.(png|jpg|jpeg|gif|ico|svg|css|js|woff2)$ {
            proxy_pass http://node_app;
            proxy_cache clinic_cache;
            proxy_cache_valid 200 1d;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
        }

        # Rate-Limited API routes
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Public Booking Pages - Micro Cached
        location /c/ {
            limit_req zone=booking_limit burst=10 nodelay;
            proxy_pass http://node_app;
            proxy_cache clinic_cache;
            proxy_cache_valid 200 1m;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # General Dynamic SSR Routes
        location / {
            proxy_pass http://node_app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
