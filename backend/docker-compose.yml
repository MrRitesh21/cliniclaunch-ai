version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saas_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - LOG_LEVEL=info
      - REDIS_URL=redis://redis:6379
      - SUPABASE_URL=${SUPABASE_URL:-http://supabase-kong:8000}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-your-service-role-key}
      - APP_VERSION=1.0.0
      - BUILD_NUMBER=101
    volumes:
      - ./logs:/app/logs
    deploy:
      resources:
        limits:
          memory: 300M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: saas_redis
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 50M
    restart: unless-stopped

networks:
  default:
    name: saas_monitoring_network
