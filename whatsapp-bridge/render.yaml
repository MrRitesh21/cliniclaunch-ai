# Render Blueprint for ClinicX WhatsApp Bridge (Free Plan)
services:
  - type: web
    name: clinicx-whatsapp-bridge
    runtime: node
    plan: free
    region: singapore
    rootDir: whatsapp-bridge
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: CLINICX_WEBHOOK_URL
        value: https://clinicx.digiwil.com/api/public/whatsapp/incoming
      - key: BRIDGE_SECRET
        value: clinicx-secret-key
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
