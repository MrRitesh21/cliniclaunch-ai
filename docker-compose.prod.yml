version: "3.8"

services:
  nginx:
    image: nginx:1.25-alpine
    container_name: clinicx-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certbot/conf:/etc/letsencrypt:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    depends_on:
      - app
      - whatsapp-bridge
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 10s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: clinicx-redis
    restart: always
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinicx-app
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BAILEYS_URL=http://whatsapp-bridge:8080
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: clinicx-worker
    restart: always
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BAILEYS_URL=http://whatsapp-bridge:8080
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy

  whatsapp-bridge:
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: clinicx-whatsapp-bridge
    restart: always
    environment:
      - PORT=8080
      - AUTH_DIR=/data/auth
      - CLINICOS_WEBHOOK_URL=http://app:3000/api/public/hooks/whatsapp
    volumes:
      - wa_auth_data:/data/auth

volumes:
  redis_data:
  wa_auth_data:
